<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Báo Quân đội nhân dân điện tử</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head>
<body>
  <header class="top-header">
    <div class="flag-bg">
      <div class="logo">
        <span class="title">Đại Đội 1 Tiểu Đoàn 14 Sư ĐOàn 5</span>
      </div>
      <p class="slogan">Tác Giả Trang Báo: Thượng uý Phạm Văn Thịnh</p>
    </div>
    <nav class="menu">
      <a href="index.html">Trang chủ</a>
      <a href="?category=Tin%20thế%20giới">Tin thế giới</a>
      <a href="?category=Tin%20trong%20nước">Tin trong nước</a>
      <a href="?category=Tin%20LLVT">Tin LLVT</a>
      <a href="?category=Tin%20đơn%20vị">Tin đơn vị</a>
      <a href="login.html" style="background:#fff;color:#c8102e;border-radius:4px;padding:6px 12px;">Đăng nhập Admin</a>
    </nav>
  </header>

  <div class="banner">
    <img src="https://file3.qdnd.vn/data/images/0/2025/04/12/upload_2264/s1.jpg?dpi=150&quality=100&w=870" alt="Banner">
  </div>

  <div class="container">
    <input type="text" id="searchBox" placeholder="🔍 Tìm kiếm bài viết..." oninput="searchArticles()">
    <select id="categoryFilter" onchange="filterArticles()">
      <option value="all">-- Tất cả chuyên mục --</option>
      <option value="Tin thế giới">Tin thế giới</option>
      <option value="Tin trong nước">Tin trong nước</option>
      <option value="Tin LLVT">Tin LLVT</option>
      <option value="Tin đơn vị">Tin đơn vị</option>
    </select>
  </div>

  <main class="main container" id="news-grid"></main>

  <script src="app.js"></script>
  <script>
    function loadAndFilter() {
      showArticlesGrid("news-grid");

      const params = new URLSearchParams(window.location.search);
      const catFromUrl = params.get('category');
      if (catFromUrl) {
        const select = document.getElementById("categoryFilter");
        if (select) {
          select.value = decodeURIComponent(catFromUrl);
          const checkLoaded = setInterval(() => {
            if (document.querySelectorAll('#news-grid .news-card').length > 0 || 
                document.querySelector('#news-grid p')) {
              clearInterval(checkLoaded);
              filterArticles();
            }
          }, 300);
        }
      }
    }

    loadAndFilter();
  </script>
</body>
</html>
